# Template only. Install under .github/workflows/windows-qa.yml to activate GitHub Actions.
name: Localdesk Windows QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-qa:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Windows native filesystem and policy tests
        run: npm run test:windows
      - name: TypeScript
        run: npm run typecheck
      - name: MCP smoke tests
        run: npm run test:mcp
      - name: Production build
        run: npm run build
